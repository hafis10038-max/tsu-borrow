<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบผู้ดูแล | TSU</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="login-page">
    <div class="tsu-hero-bg"></div>
    <nav class="navbar">
        <div class="nav-brand"><i class="fas fa-university logo-icon"></i> <span>TSU Borrowing</span></div>
        <a href="index.html" class="admin-btn"><i class="fas fa-home"></i> กลับหน้าแรก</a>
    </nav>

    <div class="login-wrapper slide-up">
        <form id="loginForm" class="login-card">
            <div class="login-icon-box"><i class="fas fa-user-shield"></i></div>
            <h2>เจ้าหน้าที่ผู้ดูแลระบบ</h2>
            <p>สำนักงานมหาวิทยาลัยทักษิณ</p>
            
            <div class="input-group" style="margin-top: 25px;">
                <label><i class="fas fa-key"></i> รหัสผ่านระบบ</label>
                <input type="password" id="adminPassword" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit" style="width:100%; margin-top:10px;">เข้าสู่ระบบจัดการ</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
